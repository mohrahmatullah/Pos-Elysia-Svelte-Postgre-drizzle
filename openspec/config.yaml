schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  POS (point-of-sale) monorepo managed with Bun workspaces.
  Layout:
    - apps/api        : REST API built with Elysia + Drizzle ORM on PostgreSQL (package @pos/api; dev server `bun run dev:api`)
    - apps/web        : Web frontend built with SvelteKit (Svelte 5) + Vite, adapter-node (package @pos/web; dev server `bun run dev:web`)
    - packages/shared : Shared types, entities, and validation used by both apps (package @pos/shared)
  Database: PostgreSQL via docker compose (`bun run docker:up`), schema managed with drizzle-kit (`bun run db:generate` / `db:migrate` / `db:seed`).
  Conventions:
    - TypeScript everywhere; strict types shared via @pos/shared
    - Tests: `bun test` (unit in apps/api/test/unit, integration in apps/api/test/integration)
    - Typecheck: `bun run typecheck` (tsc --noEmit for api/shared, svelte-check for web)
    - Domain: point-of-sale — sales, inventory, and related entities live in packages/shared/src

